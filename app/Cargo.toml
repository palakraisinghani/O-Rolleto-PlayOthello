[package]
name = "othello-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tauri shell: forwards UI commands to othello-api and engine events to the UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
othello-api = { path = "../api" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
