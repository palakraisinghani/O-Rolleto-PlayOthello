<!-- Paste this wherever you want the "Play" button on your page.
     When someone clicks it, the game opens right here, inside your page.

     Only edit data-src: the path from THIS page to the game file you uploaded
     (relative paths are safest, e.g. "othello/index.html" or "../games/othello/index.html"). -->
<div style="max-width:760px;margin:2rem auto;text-align:center">
  <button id="othello-play" type="button" data-src="othello/index.html"
    style="font:700 1.2rem Georgia,serif;padding:.9rem 2.2rem;border-radius:999px;
           border:3px solid #c9a24e;background:#a3182a;color:#fff4e0;cursor:pointer">
    Play Othello, free
  </button>
</div>
<script>
  document.getElementById('othello-play').addEventListener('click', function () {
    var frame = document.createElement('iframe');
    frame.src = this.getAttribute('data-src');
    frame.title = 'Othello';
    frame.allowFullscreen = true;
    frame.style.cssText = 'width:100%;height:min(88vh,820px);border:0;border-radius:16px;' +
                          'box-shadow:0 10px 30px rgba(0,0,0,.4)';
    this.parentNode.replaceChild(frame, this);   // swap the button for the game
  });
</script>
